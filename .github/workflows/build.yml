name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests (game logic)
        run: swift test --package-path GameCore

      - name: Install XcodeGen
        run: |
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (no code signing)
        run: |
          mkdir -p build
          if ! xcodebuild archive \
            -project InflaGyoza.xcodeproj \
            -scheme InflaGyoza \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/InflaGyoza.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1; then
            echo "::group::errors"
            grep -n -E "error:|error :|fatal" -A 8 build/xcodebuild.log | head -n 400 || true
            echo "::endgroup::"
            echo "---- last lines ----"
            tail -n 60 build/xcodebuild.log
            exit 1
          fi
          grep -E "warning:" build/xcodebuild.log | sort -u | head -n 60 || true
          tail -n 5 build/xcodebuild.log

      - name: Package IPA
        run: |
          APP="build/InflaGyoza.xcarchive/Products/Applications/InflaGyoza.app"
          test -d "$APP"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../InflaGyoza-unsigned.ipa Payload)
          ls -la build/InflaGyoza-unsigned.ipa

      - name: Verify IPA
        run: |
          rm -rf build/verify
          mkdir -p build/verify
          unzip -q build/InflaGyoza-unsigned.ipa -d build/verify
          APP="build/verify/Payload/InflaGyoza.app"
          test -f "$APP/Info.plist"
          test -f "$APP/InflaGyoza"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          lipo -archs "$APP/InflaGyoza" | tee build/archs.txt
          grep -q arm64 build/archs.txt
          if [ -d "$APP/_CodeSignature" ]; then echo "unexpected signature"; exit 1; fi
          echo "IPA OK"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InflaGyoza-unsigned-ipa
          path: build/InflaGyoza-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
